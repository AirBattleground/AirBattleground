# 7XEN Studio Box — MediaMTX: receives the phones' RTMP over the venue Wi-Fi and serves HLS to the box (same PC).
# Copy of deploy/pcmedia/mediamtx.yml with the auth hook pointing at the box. Every publish/read is checked by the box:
#   publish  live/dev_<deviceId>?token=<signed, 10 min>   (token from POST /api/device/stream/start on the box)
#   publish  live/show_<showId>   only from this PC (the Studio worker's local copy of the show, preview)
#   read     only from this PC, or with the box's internal user/pass (derived from data/secret)
# Ports can be overridden with MTX_* env vars (docker-compose.yml does that from MEDIA_RTMP_PORT / MEDIA_HLS_PORT /
# MEDIA_API_PORT / PORT), so this file stays the same on every box.

logLevel: info
logDestinations: [stdout]

authMethod: http
authHTTPAddress: http://127.0.0.1:4300/box/media/auth
authHTTPExclude:
  - action: metrics
  - action: pprof

# control API (path state, kick a removed phone); the box calls it with its internal credentials. Keep it off the LAN.
api: yes
apiAddress: 127.0.0.1:9997

# phones publish here — open TCP 1935 in the PC's firewall for the venue Wi-Fi
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# HLS for the box's proxy (local only; the Studio gets it same-origin through http://<box>:4300/box/devices/<id>/live/)
hls: yes
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: yes
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsAllowOrigin: ""

rtsp: no
webrtc: no
srt: no

paths:
  # dev_ = a phone's raw video (phone publishes), show_ = the finished show's local copy (Studio worker publishes)
  "~^live/(dev|show)_[A-Za-z0-9]{8,40}$":
    source: publisher
