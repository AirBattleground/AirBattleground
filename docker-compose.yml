# Local dev:      docker-compose up -d db            (Postgres only — what `pnpm db:up` runs)
# Full stack:     docker-compose --profile full up -d --build
#                 web   → http://<this-machine-ip>/            (team & manager portal, port 80)
#                 admin → http://<this-machine-ip>/admin-ui   (admin console)
#                 api   → internal only; reached through /api on either site
# Seed the full stack from the host (db is published on :5433):  pnpm db:seed

services:
  db:
    image: postgres:16-alpine
    container_name: 7xen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sevenxen
      POSTGRES_PASSWORD: sevenxen
      POSTGRES_DB: sevenxen
    ports:
      - "5433:5432"
    volumes:
      - 7xen-pgdata:/var/lib/postgresql/data

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host # build-time DNS works even where the docker bridge can't resolve
    image: 7xen-api:latest
    container_name: 7xen-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://sevenxen:sevenxen@db:5432/sevenxen?schema=public
      # override in a real deployment: JWT_SECRET=$(openssl rand -hex 32) docker-compose --profile full up -d
      JWT_SECRET: ${JWT_SECRET:-insecure-local-compose-secret-change-me-0123456789abcdef}
      COOKIE_SECURE: ${COOKIE_SECURE:-0} # plain http on the LAN; set 1 behind https
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      ADMIN_NAME: ${ADMIN_NAME:-7xen Admin}
      # Screenshot reading runs the `claude` CLI (in the image). It logs in with a long-lived token from
      # `claude setup-token`, set as CLAUDE_CODE_OAUTH_TOKEN in the gitignored ./.env. Unset = "reader offline".
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      STORAGE_DIR: /data/storage
      # phase 4b: 7XEN Station (host service, systemd --user; see docs/phase4/STATION.md).
      # STATION_TOKEN comes from the gitignored ./.env next to this file (same value as services/station/.env).
      STATION_URL: ${STATION_URL:-http://host.docker.internal:4500}
      STATION_TOKEN: ${STATION_TOKEN:-}
      # phase 6: MediaMTX on the host network (service "media")
      MEDIA_HLS_URL: ${MEDIA_HLS_URL:-http://host.docker.internal:8888}
      MEDIA_API_URL: ${MEDIA_API_URL:-http://host.docker.internal:9997}
      MEDIA_RTMP_INTERNAL: ${MEDIA_RTMP_INTERNAL:-rtmp://host.docker.internal:1935}
      # phase 6: admin health gauges read the host's CPU / RAM / network, not the container's
      HOST_PROC: /host/proc
      MEDIA_RTMP_URL: ${MEDIA_RTMP_URL:-rtmp://localhost:1935/live}
    extra_hosts:
      - "host.docker.internal:host-gateway" # the station runs on the host, not in Docker
    volumes:
      - ./storage:/data/storage # same folder the dev setup uses, so existing samples/screenshots keep working
      - /proc:/host/proc:ro
    ports:
      - "127.0.0.1:4000:4000" # only for the host-networked web container; not exposed to the LAN

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      network: host # build-time DNS works even where the docker bridge can't resolve
    image: 7xen-web:latest
    container_name: 7xen-web
    restart: unless-stopped
    depends_on:
      - api
    # Host networking: nginx listens directly on this machine's port 80, so phones on the Wi-Fi
    # reach it even when net.ipv4.ip_forward=0 (which blocks Docker's NAT-published ports).
    network_mode: host
    environment:
      API_UPSTREAM: http://127.0.0.1:4000

  # phase 6: iPhone streams (RTMP in on :1935, HLS out on :8888 for the API). Dev: `docker compose up -d media`.
  # Host networking so its auth hook reaches the API on 127.0.0.1:4000 (host `pnpm dev` or the api container).
  media:
    image: bluenviron/mediamtx:1.9.3
    container_name: 7xen-media
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/media/mediamtx.yml:/mediamtx.yml:ro

volumes:
  7xen-pgdata:
